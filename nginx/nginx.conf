# TLS terminates at the Cloudflare edge; the tunnel forwards plain HTTP to the
# host port this is published on (WEB_PORT in docker-compose.yml). No
# ssl_certificate here — nginx just proxies to the app and serves static/media.
server {
    listen 80;
    server_name _;

    # Cover art and document uploads (DESIGN §7). Bump if large PnP files land.
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /static/ {
        alias /data/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Baked square grid-tile previews (#104) are content-addressed — the
    # filename carries a hash of the rendered pixels (#116), so a URL never
    # maps to a different image. Serve them immutable (like /static/) for
    # maximum browser caching; a re-bake (focus/zoom/fit edit) gets a new URL.
    # Longest-prefix match means this wins over /media/ for previews only.
    location /media/covers/previews/ {
        alias /data/media/covers/previews/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /data/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare already served the client over HTTPS; tell Django so its
        # SECURE_PROXY_SSL_HEADER check passes (secure cookies + CSRF Origin).
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
