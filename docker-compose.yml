# Registry-based deploy for Portainer on TrueNAS SCALE. The NAS never builds:
# the image is built+pushed by .github/workflows/deploy.yml on a version tag,
# and pulled here. ALL configuration comes from the Portainer stack's
# Environment section (the README has a paste-ready list) — both the deploy
# knobs below and the app secrets that feed the x-app-env anchor:
#   IMAGE_TAG   image tag to run (default: latest; pin to e.g. 2026.07.05)
#   DATA_ROOT   SSD dataset: SQLite DB + logs + static + cover media
#   BULK_ROOT   HDD dataset: backups + document uploads (bulky PnP/rulebook
#               files, nested-mounted into the media tree at /data/media/documents)
#   PUID/PGID   host user/group that should own the mounted data (default 1000)
#   WEB_PORT    host port nginx is published on for the tunnel (default: 8080)
# TLS + public access are handled by an external Cloudflare Tunnel pointed at
# nginx on host port WEB_PORT, so there are no published 443 / certs here.

# Shared container env — merged into each app service via `<<: *app-env`.
# Values are interpolated from the Portainer stack Environment variables; we
# don't use an env_file on the dataset because Portainer's compose parser runs
# inside the Portainer container and can't see host paths. Required vars use
# ${VAR:?msg} so a missing value fails the deploy loudly instead of booting
# insecure. SERVICE is set per service.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: GameKeeperProject.settings_prod
  DB_PATH: /data/db/db.sqlite3
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required - set it in the Portainer stack env}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required - set it in the Portainer stack env}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required - set it in the Portainer stack env}"
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-gamekeeper@example.com}
  BGG_API_TOKEN: ${BGG_API_TOKEN:-}
  BGG_USERNAME: ${BGG_USERNAME:-}
  BGG_PASSWORD: ${BGG_PASSWORD:-}
  BGG_ENCRYPTION_KEY: ${BGG_ENCRYPTION_KEY:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ghcr.io/kernicek/gamekeeper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE: web
    volumes:
      # db/logs/static/media (covers) on the SSD (db shared by web + celery-worker);
      # backups + bulky document uploads on the HDD. Documents nest under the media
      # tree at /data/media/documents so their public URLs stay /media/... (Docker
      # mounts the parent first). All owned by PUID:PGID (entrypoint chowns).
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/db:/data/db
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/logs:/data/logs
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/static:/data/static
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/media:/data/media
      - ${BULK_ROOT:?BULK_ROOT is required - set it in the Portainer stack env}/documents:/data/media/documents
      - ${BULK_ROOT:?BULK_ROOT is required - set it in the Portainer stack env}/backups:/data/backups
    depends_on:
      - redis
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('localhost',8000,timeout=4); c.request('GET','/'); r=c.getresponse(); sys.exit(0 if r.status<500 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 15
      # Generous first-boot grace: chown of /data + migrate + collectstatic all
      # run before gunicorn binds, and a big seeded DB / slow disk can push that
      # past a short window, spuriously flapping the container to unhealthy.
      start_period: 180s

  celery-worker:
    image: ghcr.io/kernicek/gamekeeper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE: celery-worker
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/db:/data/db
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/logs:/data/logs
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/media:/data/media
      - ${BULK_ROOT:?BULK_ROOT is required - set it in the Portainer stack env}/documents:/data/media/documents
      - ${BULK_ROOT:?BULK_ROOT is required - set it in the Portainer stack env}/backups:/data/backups
    depends_on:
      - redis

  celery-beat:
    image: ghcr.io/kernicek/gamekeeper:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE: celery-beat
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/db:/data/db
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/logs:/data/logs
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # Host port is WEB_PORT (set it in the Portainer stack env — 8000 is
      # taken on this NAS); the tunnel points at http://<nas-ip>:${WEB_PORT}.
      - "${WEB_PORT:-8080}:80"
    volumes:
      # nginx.conf comes from the DATA_ROOT dataset (an absolute host path the
      # Docker daemon can see), NOT a ./relative path: a Git-stack checkout lives
      # inside the Portainer container and isn't visible to the daemon, which then
      # auto-creates the missing source as a dir and fails to mount it onto the
      # config file. Copy nginx/nginx.conf to ${DATA_ROOT}/nginx.conf before
      # deploying (see the README).
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/static:/data/static:ro
      - ${DATA_ROOT:?DATA_ROOT is required - set it in the Portainer stack env}/media:/data/media:ro
      # nginx serves /media/documents/ too, so it needs the HDD documents mount.
      - ${BULK_ROOT:?BULK_ROOT is required - set it in the Portainer stack env}/documents:/data/media/documents:ro
    depends_on:
      # service_started (not service_healthy): nginx tolerates web being briefly
      # unavailable — it returns 502 until web binds — instead of the whole deploy
      # aborting (and Portainer rolling back) when web's first-boot migrate +
      # collectstatic runs long. web's healthcheck still reports status.
      web:
        condition: service_started
