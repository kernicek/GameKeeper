name: Build & push image

# Deploys are gated on version tags, not on every push to master. To ship:
#   git tag v5 && git push origin v5
# CI then builds and pushes ghcr.io/kernicek/gamekeeper:v5 (+ :latest), and
# Portainer on the NAS pulls it (manually, or via the stack webhook).
on:
  push:
    tags:
      - 'v*'         # v5, v2026.07.05
      - '[0-9]*'     # bare CalVer: 2026.07.05, 2026.07.05.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces two tags: the version (v5) for rollback pinning and :latest so
      # the Portainer stack can track a stable ref. Keeping only these two tags
      # (not per-commit shas) keeps GHCR storage well under the free quota.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kernicek/gamekeeper
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the pushed tag into the image as APP_VERSION so the running app
          # knows its own version for the "newer image available" check (#95).
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # GitHub Actions layer cache: incremental tag builds drop to ~1-2 min.
          cache-from: type=gha
          cache-to: type=gha,mode=max
